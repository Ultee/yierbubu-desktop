<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"><title>和一二聊聊</title><link rel="stylesheet" href="chat.css"></head><body>
<header><div class="avatar">一二</div><div><h1>一二在这里</h1><p id="chat-caption">想说什么，都可以慢慢说。</p></div><button id="chat-settings" title="AI 设置">⚙</button></header>
<main id="chat-messages" aria-live="polite"><div id="chat-empty"><span>今天也辛苦啦。</span><p>工作的吐槽，生活的小事，<br>都可以和我说一说。</p></div><div id="chat-thread"></div><div id="chat-thinking" hidden>一二正在想…</div></main>
<footer><div class="privacy"><span id="chat-memory">本次聊天不保存到磁盘</span><button id="chat-clear" type="button">清空记录</button></div><p id="chat-error" role="status"></p><form id="chat-form"><label class="sr-only" for="chat-input">发给一二的消息</label><textarea id="chat-input" rows="2" maxlength="4000" placeholder="和一二说点什么…"></textarea><button id="chat-send" type="submit">发送 ↗</button></form><p class="hint">Enter 发送 · Shift + Enter 换行</p></footer>
<script src="chat.js"></script></body></html>
