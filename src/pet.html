<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"><title>秒薪桌宠</title><link rel="stylesheet" href="pet.css"></head>
<body><main id="island">
  <section id="card" aria-label="今日收入" hidden>
    <header><span class="brand"><span class="dot"></span> 秒薪桌宠</span><button id="open-settings" title="设置月薪与作息" aria-label="设置">⚙</button></header>
    <div class="eyebrow">今日已赚 <span id="state-label">等待设置</span></div>
    <div class="amount"><span class="currency">¥</span><strong id="earned">0.00</strong></div>
    <div class="rate-line"><span>每一秒，都有收获</span><span id="rate">—</span></div>
    <div class="divider"></div>
    <footer><span id="status">请先设置月薪与作息</span><span id="countdown"></span></footer>
    <p id="warning" hidden></p>
  </section>
  <div id="bridge"></div>
  <div id="pet" role="img" aria-label="一二桌宠，悬停查看收入，拖动移动位置，右键打开菜单" tabindex="-1">

  </div>
</main><script src="pet.js"></script></body></html>
